# Configuración de despliegue en Netlify.
#
# Netlify detecta Next.js solo y le aplica su adaptador (OpenNext) sin que haya
# que instalar ni declarar ningún plugin. Lo que va acá es lo que NO puede
# adivinar por su cuenta.

[build]
  # `prisma generate` va explícito y no delegado al postinstall del
  # package.json. Netlify reutiliza la caché de node_modules entre
  # despliegues: cuando la caché sirve, npm no reinstala nada y el postinstall
  # nunca llega a correr. Como el cliente generado vive en /generated/prisma
  # —fuera de node_modules y excluido del repositorio por .gitignore— el
  # despliegue siguiente reventaría con "Can't resolve '@/generated/prisma'",
  # y el error no apunta para nada a la caché.
  command = "npx prisma generate && npm run build"

  # El adaptador de Netlify parte de la salida estándar de `next build`.
  publish = ".next"

[build.environment]
  # Prisma 7 exige Node ^20.19 || ^22.12 || >=24, y Next 16 pide 20.9 o
  # superior. Sin fijarlo quedamos a merced de la versión que Netlify traiga
  # por defecto el día del despliegue.
  NODE_VERSION = "22"

  # Blindaje por si alguien define NODE_ENV=production en el panel: sin esto
  # npm omitiría las devDependencies, y prisma, typescript, tailwindcss y
  # eslint-config-next hacen falta para compilar.
  NPM_FLAGS = "--include=dev"

  # Escáner de secretos: se queda ENCENDIDO, solo se le sacan cuatro claves
  # cuyo valor no es secreto y que por eso aparecían legítimamente en la
  # salida del build, tumbando el despliegue.
  #
  #   SMTP_HOST         "smtp-relay.brevo.com". Coincide dentro del propio
  #                     nodemailer, que trae una lista de proveedores SMTP
  #                     conocidos. No es nuestra configuración filtrándose.
  #   SMTP_TO           Es el correo público de contacto de la empresa, el
  #                     mismo que se muestra en el sitio (lib/contacto.ts y
  #                     lib/empresa.ts). Está en la página a propósito.
  #   APP_URL           La dirección pública del sitio. Sale en el robots.txt.
  #   WOMPI_PUBLIC_KEY  Pública por definición: viaja en el link del checkout,
  #                     a la vista del navegador del cliente.
  #
  # Lo que NO se omite, y se sigue vigilando: AUTH_SECRET, DATABASE_URL,
  # WOMPI_INTEGRITY_SECRET, WOMPI_EVENTS_SECRET, WOMPI_PRIVATE_KEY, SMTP_USER
  # y SMTP_PASS. Si alguno de esos aparece algún día en el build, el
  # despliegue tiene que fallar. Por eso no se usa SECRETS_SCAN_ENABLED=false:
  # apagarlo entero dejaría pasar una fuga de verdad sin decir nada.
  #
  # SMTP_SECURE y SMTP_PORT no hacen falta acá: el escáner ya ignora los
  # booleanos y los valores de cuatro caracteres o menos.
  SECRETS_SCAN_OMIT_KEYS = "SMTP_HOST,SMTP_TO,APP_URL,WOMPI_PUBLIC_KEY"
